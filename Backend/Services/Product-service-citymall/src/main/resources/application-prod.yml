server:
  port: 8050

spring:
  application:
    name: product-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/citymall2.0?options=-c%20timezone=UTC
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmNoLW1lLWNpdHltYWxsLWRldi1zZWNyZXQtMzJieXRlcyE=}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Product Service
    version: 1.0.0
    description: CityMall Product Microservice
